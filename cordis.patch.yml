# Bundle layer applied by `dsh plugin add` once this package is a profile
# dependency. Without this file (and package.json `dsh.bundle.patch`), DSH
# installs the package as a plain library: no loader row, no Host apply, no
# `/plugins/<name>/client.js`.
#
# `searchProvider` and the upstream `fetchProvider` are restated in full
# because a Cordis patch replaces the targeted row's whole `config`. The
# profile's own cordis.patch.yml still wins if it later overrides `web`.
#
# Defaults mirror the Harness `0.2.2` defaults: the in-box `deepseek-search-api`
# provider searches, and `http` fetches from this device. Selecting any engine
# this bundle serves (legacy Messages, Tavily, Brave, Serper, …) switches
# `searchProvider` back to `dsh-web-search`, this bundle's own seam id, and
# leaves the backend to the plugin's `provider` setting.
#
# `deepseek-search-api` needs the in-box `web-deepseek-api` layer, which the
# Harness ships from `0.2.1-rc.2` on. A profile without it must pick another
# engine on the settings page.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-search-api
    fetchProvider: http

# Disable the in-box legacy DeepSeek search plugin so the profile has one
# active legacy Messages configuration surface: this bundle's `dsh-web-search`
# provider with its `deepseek-official` backend. That provider id is distinct
# from the in-box `deepseek-official` one.
- id: web-search-deepseek
  disabled: true

# Disable the in-box "Web search & fetch" settings page. Its two seams (`web`
# and `web-deepseek-api`) are exactly what this bundle's own page edits, and
# showing both leaves the user with two entry points for one configuration.
# This row is inserted by `@deepseek-ai/dsh-web-app`; the bundle layer is
# applied after it, so the disable lands on an existing row.
- id: ui-settings-web-search
  disabled: true

- insert:
    - id: dsh-web-search-plugin
      name: dsh-web-search-plugin
      config:
        provider: deepseek-search-api
