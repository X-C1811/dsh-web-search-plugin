name: Publish to npm

# Only pushing a `v*` tag (e.g. v0.1.1) triggers a release.
# Plain pushes to `main` never publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release
  id-token: write # OIDC token required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Syntax check
        run: npm run check

      - name: Provider regression tests
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match pushed tag ($TAG_VERSION). Expected v$PKG_VERSION."
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      # A prerelease must never take the `latest` dist-tag: `npm install <pkg>`
      # resolves that tag, so every fresh install would land on a build that is
      # not ready to be the default. Publish under the prerelease identifier
      # instead (`-alpha.1` → `alpha`, `-rc.2` → `rc`), which `npm publish`
      # applies to the version without touching `latest`. A stable version keeps
      # the default `latest`.
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          if [[ "$PKG_VERSION" == *-* ]]; then
            IDENTIFIER="${PKG_VERSION#*-}"
            IDENTIFIER="${IDENTIFIER%%.*}"
            # dist-tags cannot start with a digit, so an unnamed numeric
            # prerelease falls back to the conventional `next`.
            if [[ ! "$IDENTIFIER" =~ ^[a-zA-Z] ]]; then
              IDENTIFIER="next"
            fi
            {
              echo "tag=$IDENTIFIER"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
            echo "$PKG_VERSION is a prerelease; publishing under dist-tag '$IDENTIFIER' and leaving 'latest' untouched."
          else
            {
              echo "tag=latest"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
            echo "$PKG_VERSION is a stable release; publishing under dist-tag 'latest'."
          fi

      # Release notes are taken from the matching CHANGELOG section, so the
      # GitHub Release uses the hand-maintained changelog.
      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release notes for $VERSION. Add a non-empty ## [$VERSION] section before publishing."
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.dist_tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.dist_tag.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${FLAGS[@]}"
