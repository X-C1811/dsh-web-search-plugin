name: CI

# Pull requests only. Tag releases already run `npm run check` inside
# publish.yml; a push to main must not start a second workflow.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Pack dry-run
        run: npm pack --dry-run
