<rect x="514" y="214" width="390" height="38" rx="9" fill="#eaf8f2"/><text x="530" y="239" font-size="17" fill="#087b6d">本地 HTTP（默认）</text><text x="514" y="291" font-size="17" >DeepSeek Fetch API</text>
