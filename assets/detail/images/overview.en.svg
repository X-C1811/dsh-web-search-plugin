<rect x="56" y="214" width="390" height="38" rx="9" fill="#eef5ff"/><text x="72" y="239" font-size="17" fill="#245fa3">Direct search API</text>
<text x="56" y="291" font-size="17" >DeepSeek Messages search (default)</text>
