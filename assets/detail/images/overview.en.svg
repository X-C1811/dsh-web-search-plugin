<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#163b46">
<rect x="32" y="32" width="7" height="54" rx="3.5" fill="url(#accent)"/>
<text x="56" y="57" font-size="28" font-weight="700">Choose search and retrieval independently</text><text x="56" y="85" font-size="16" fill="#506a75">Configure both in Settings → Web search</text>
<rect x="32" y="116" width="438" height="210" rx="18" fill="#fff" stroke="#d8e6ec"/>
<rect x="490" y="116" width="438" height="210" rx="18" fill="#fff" stroke="#d8e6ec"/>
