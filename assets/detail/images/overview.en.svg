<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Choose search and retrieval independently</title><desc id="desc">Configure both in Settings → Web search. Saved settings apply to the next operation. Feature diagram · not a screenshot</desc>
